<div class="panel">
  <h2>Выбранные</h2>

  <div class="filter-row">
    <input
      type="text"
      placeholder="Фильтр по содержимому..."
      [ngModel]="filterQuery()"
      (ngModelChange)="updateFilter($event)"
    />
  </div>

  <cdk-virtual-scroll-viewport
    itemSize="48"
    class="viewport"
    (scrolledIndexChange)="onScrolled()"
    (scroll)="onScrolled()"
  >
    <div
      cdkDropList
      [cdkDropListData]="items()"
      (cdkDropListDropped)="drop($event)"
    >
      <div
        *cdkVirtualFor="let item of items(); let idx = index; templateCacheSize: 0; trackBy: trackById"
        cdkDrag
        [cdkDragData]="[item, idx]"
        [attr.data-drag-index]="idx"
        class="item-row"
      >
        <span class="drag-handle">⠿</span>
        <span class="item-content">{{ item.content }}</span>
        <button class="remove-btn" (click)="deselectItem(item)">←</button>
      </div>
    </div>
  </cdk-virtual-scroll-viewport>

  <div class="footer">
    Загружено: {{ items().length }} / {{ total() }}
  </div>
</div>
