<div class="panel">
  <h2>Все элементы</h2>

  <div class="filter-row">
    <input
      type="text"
      placeholder="Фильтр по содержимому..."
      [ngModel]="filterQuery()"
      (ngModelChange)="updateFilter($event)"
    />
  </div>

  <div class="add-row">
    <input
      type="text"
      placeholder="Текст нового элемента"
      [ngModel]="newContent()"
      (ngModelChange)="updateNewContent($event)"
    />
    <button (click)="addItem()" [disabled]="!newContent().trim()">Добавить</button>
  </div>

  <div *ngIf="pendingMessage()" class="pending-message">{{ pendingMessage() }}</div>

  <cdk-virtual-scroll-viewport
    itemSize="48"
    class="viewport"
    (scrolledIndexChange)="onScrolled()"
    (scroll)="onScrolled()"
  >
    <div
      *cdkVirtualFor="let item of items(); trackBy: trackById"
      class="item-row"
      (click)="selectItem(item)"
    >
      <span class="item-content">{{ item.content }}</span>
      <button class="select-btn">→</button>
    </div>
  </cdk-virtual-scroll-viewport>

  <div class="footer">
    Загружено: {{ items().length }} / {{ total() }}
  </div>
</div>
